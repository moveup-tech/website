    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: "Space Grotesk", sans-serif;
        background: #0e1210;
        color: #ecefea;
        -webkit-font-smoothing: antialiased;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -2;
        background:
          radial-gradient(
            circle at 18% 12%,
            rgba(124, 242, 156, 0.12),
            transparent 28%
          ),
          radial-gradient(
            circle at 82% 8%,
            rgba(242, 200, 121, 0.08),
            transparent 28%
          ),
          linear-gradient(#232b26 1px, transparent 1px),
          linear-gradient(90deg, #232b26 1px, transparent 1px), #0e1210;
        background-size:
          auto,
          auto,
          64px 64px,
          64px 64px,
          auto;
        mask-image: radial-gradient(
          ellipse 85% 65% at 50% 0%,
          black 45%,
          transparent 100%
        );
        opacity: 0.88;
        pointer-events: none;
      }
      body::after {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -1;
        background: linear-gradient(
          115deg,
          transparent 0%,
          rgba(124, 242, 156, 0.05) 45%,
          transparent 65%
        );
        transform: translateX(-70%);
        animation: sheen 12s ease-in-out infinite;
        pointer-events: none;
      }
      .reveal {
        opacity: 0;
        transform: translateY(18px);
        transition:
          opacity 0.7s ease,
          transform 0.7s ease;
      }
      .reveal.is-visible {
        opacity: 1;
        transform: translateY(0);
      }
      .pulse-dot {
        animation: pulseDot 1.8s ease-in-out infinite;
      }
      @keyframes pulseDot {
        0%,
        100% {
          opacity: 1;
          box-shadow: 0 0 0 0 rgba(124, 242, 156, 0.45);
        }
        50% {
          opacity: 0.55;
          box-shadow: 0 0 0 8px rgba(124, 242, 156, 0);
        }
      }
      @keyframes sheen {
        0%,
        72%,
        100% {
          transform: translateX(-70%);
        }
        86% {
          transform: translateX(70%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
          scroll-behavior: auto !important;
        }
        .reveal {
          opacity: 1;
          transform: none;
        }
      }
    </style>
